<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gleichungen umformen II</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f2fa;color:#242046;font:1.05rem/1.5 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:clamp(12px,4vw,40px)}header,footer,.dots,.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}header,footer{justify-content:space-between}h1,h2{letter-spacing:-.045em;line-height:1.15}h1{font-size:clamp(1.5rem,4vw,2.3rem)}h2{font-size:2rem;margin:.4em 0}article{background:white;border-radius:24px;padding:clamp(14px,3vw,38px)}small{font-weight:bold;color:#635b80}.dots i{width:15px;height:7px;background:#d2cfe2;border-radius:8px}.dots .done{background:#27947e}.dots .now{background:#7150dc}.row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) 208px;gap:8px;align-items:center;margin:8px 0}.side{background:#ece7ff;border-radius:14px;min-height:76px;align-self:stretch;display:grid;place-items:center;padding:8px}.right{background:#d9f5ee}.fraction{max-width:100%;text-align:center;font:bold 1.35rem Georgia,serif}.line{display:flex;align-items:center;justify-content:center;gap:.22em;flex-wrap:wrap;padding:3px}.den{border-top:2px solid}.actions{border-left:2px solid;padding-left:9px;gap:5px}.factor{background:#ffffffbf;border-radius:5px;padding:1px 5px}button,select{font:inherit;font-weight:650;color:inherit;border:0;border-radius:10px;min-height:44px;min-width:44px;padding:7px 10px;background:#efedf6;cursor:pointer}.go{background:#5035ac;color:white}.hint{background:#fff3c8;border-radius:12px;padding:12px}.success{background:#d5f4e2}footer,details{margin-top:16px}.cancel{animation:vanish .95s both}@keyframes vanish{20%,65%{background:#ffd57a;text-decoration:line-through;color:#6e3100}100%{opacity:0}}@media(max-width:590px){.row{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}.actions{grid-column:3;flex-wrap:wrap}.fraction{font-size:1.1rem}.dots{gap:4px}}
.crossed{text-decoration:line-through;text-decoration-color:#873a26;text-decoration-thickness:2px}</style></head><body><main><header><h1>Gleichungen umformen II</h1><div class="dots" aria-hidden="true"></div></header><article id="app"></article></main>
<script>
const tasks=[
 ['5','2 5','','10',''],['18','18','3','6',''],['x','4 x','','20',''],['a','a','5','b',''],
 ['s','3 s','2','9',''],['t','v t','','s',''],['y','2 y','a','b',''],['p','k p','3','r','s'],
 ['u','2 a u','','b','c'],['m','3 m','a b','n',''],['z','a z','b','c d','e'],
 ['h','2 a h','b','c','3 d'],['q','k q','m n','r s','t'],['w','a b w','c d','e','f g'],
 ['j','2 a b j','c d','e f','3 g']
];
const app=document.querySelector('#app');
let index=0,rows,pending,locked,solved;
function load(){
 rows=[{parts:tasks[index].slice(1).map(s=>s.split(' ').filter(Boolean))}];
 pending=false;locked=false;solved=false;render();
}
function cancellable(parts){
 const removed=parts.map(()=>new Set());
 for(const slot of [0,2]){
 parts[slot].forEach((value,i)=>{
 const j=parts[slot+1].findIndex((v,k)=>v===value&&!removed[slot+1].has(k));
 if(j<0)return;
 removed[slot].add(i);removed[slot+1].add(j);

 });
 }
 return removed;
}
function fraction(parts,slot,crossed){
 function line(i){return parts[i].map((v,k)=>'<span class="factor'+(crossed?.[i].has(k)?' crossed':'')+'" data-pos="'+i+'-'+k+'">'+v+'</span>').join(' · ')||'1'}
 return '<div class="fraction"><div class="line">'+line(slot)+'</div>'+(parts[slot+1].length?'<div class="line den">'+line(slot+1)+'</div>':'')+'</div>';
}
function controls(parts){
 return '<div class="actions"><select id="op" aria-label="Rechenoperation"><option value="times">·</option><option value="divide">:</option></select><select id="factor" aria-label="Element"><option value="">…</option>'+[...new Set(parts.flat())].map(x=>'<option>'+x+'</option>').join('')+'</select><button class="go" id="apply" disabled aria-label="Operation auf beide Seiten anwenden">↓</button></div>';
}
function render(message='Wähle eine Operation und einen Faktor.'){
 document.querySelector('.dots').innerHTML=tasks.map((_,i)=>'<i class="'+(i<index||i===index&&solved?'done':i===index?'now':'')+'"></i>').join('');
 const goal=tasks[index][0];
 app.innerHTML='<small>Aufgabe '+(index+1)+' von 15</small><h2>Stelle <em>'+goal+'</em> frei.</h2><p>'+goal+' soll alleine auf der linken Seite stehen.</p>'+rows.map(({parts,note,crossed},i)=>{
 const last=i===rows.length-1;
 const action=last&&!solved?(pending?'<div class="actions"><button id="reduce">Kürzen</button></div>':controls(parts)):(note?'<div class="actions">'+note+'</div>':'');
 return '<div class="row"><div class="side">'+fraction(parts,0,crossed)+'</div><b>=</b><div class="side right">'+fraction(parts,2,crossed)+'</div>'+action+'</div>';
 }).join('')+'<div role="status" class="hint '+(solved?'success':'')+'">'+message+'</div><details><summary>Hilfe</summary>Multipliziere oder dividiere beide Seiten mit demselben Faktor. Tippe auf ↓. Gibt es gleiche Faktoren über und unter einem Bruchstrich, tippe auf Kürzen. Die gekürzten Paare bleiben in der Zwischenzeile durchgestrichen. Alle Variablen stehen für Zahlen ungleich null. Rechts darf ein Produkt oder Bruch stehen bleiben.</details><footer><button id="undo" aria-label="Letzten Schritt zurücknehmen" '+(rows.length===1||solved?'disabled':'')+'>↶</button><button class="go" id="'+(solved?'next':'finish')+'" '+(pending?'disabled':'')+'>'+(solved?(index===14?'Zur Auswertung':'Nächste Aufgabe'):'Fertig')+'</button></footer>';
}
app.onchange=()=>{if(document.querySelector('#apply'))document.querySelector('#apply').disabled=!document.querySelector('#factor').value};
app.onclick=async event=>{
 const id=event.target.closest('button')?.id;
 if(!id||locked)return;
 const current=rows.at(-1), parts=current.parts;
 if(id==='apply'){
 const value=document.querySelector('#factor').value,divide=document.querySelector('#op').value==='divide';
 const next=parts.map(group=>group.slice());
 for(const slot of [0,2])next[slot+Number(divide)].push(value);
 current.note=(divide?': ':'· ')+value;
 const pairs=cancellable(next);
 rows.push({parts:next,pairs});
 pending=pairs.some(set=>set.size);
 render(pending?'So sieht die Operation vor dem Kürzen aus. Tippe auf Kürzen.':'Hier lässt sich nichts kürzen. Du kannst direkt weiterrechnen.');
 }else if(id==='reduce'){
 locked=true;
 const active=app.querySelector('#reduce').closest('.row');
 current.pairs.forEach((indices,slot)=>{
   for(const i of indices)active.querySelector('[data-pos="'+slot+'-'+i+'"]').classList.add('cancel');
 });
 await new Promise(resolve=>setTimeout(resolve,1000));
 current.crossed=current.pairs;
 rows.push({parts:parts.map((group,s)=>group.filter((_,i)=>!current.crossed[s].has(i))),reduced:true});
 pending=false;locked=false;render('Die durchgestrichenen Faktoren wurden gekürzt. Prüfe deine Gleichung.');
 }else if(id==='undo'){
 rows.splice(rows.length-(current.reduced?2:1));delete rows.at(-1).note;pending=false;render();
 }else if(id==='finish'){
 const goal=tasks[index][0],extra=parts[0].find(v=>v!==goal);
 solved=parts[0].length===1&&parts[0][0]===goal&&!parts[1].length&&!parts.slice(2).flat().includes(goal);
 const hint=parts[1][0]?'Multipliziere beide Seiten mit '+parts[1][0]+'.':extra?'Dividiere beide Seiten durch '+extra+'.':'Nimm deinen letzten Schritt zurück.';
 render(solved?'Richtig! '+goal+' steht allein auf der linken Seite.':'Noch nicht ganz. '+hint);
 }else if(id==='next'){
 if(++index===tasks.length){app.innerHTML='<h2>Herzlichen Glückwunsch!</h2><p>Du hast alle 15 Gleichungen richtig umgeformt.</p><button class="go" id="restart">Noch einmal spielen</button>'}
 else load();
 }else if(id==='restart'){index=0;load()}
 if(['apply','reduce','next','restart'].includes(id))app.querySelector('#reduce,#apply,#restart')?.scrollIntoView({block:'nearest'});
};
load();
</script></body></html>
