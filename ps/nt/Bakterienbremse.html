<script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
const windowArt=(x,i)=>`<g transform="translate(${x} 43)" id="win${i}" class="object" tabindex="0" role="button"><rect x="-8" y="-8" width="200" height="144" rx="5" fill="#bb9673"/><use href="#view"/><g stroke="#fcf8e7" fill="none" stroke-width="7"><rect width="184" height="124"/><path class="offOnly" d="M92 0v124M0 62h184"/><g class="onOnly"><path d="M0 0l29 12v98L0 124Zm184 0-29 12v98l29 14Z" fill="#b2d6c9"/></g></g><rect x="-13" y="126" width="210" height="9" rx="3" fill="#b07c56"/><rect x="13" y="141" width="158" height="28" rx="14" class="tag"/><text x="92" y="160" class="label" id="winLabel${i}"></text></g>`;
$('windows').innerHTML=windowArt(171,0)+windowArt(648,1);
$('ribs').setAttribute('d',Array.from({length:13},(_,i)=>'M'+(34+15*i)+' 242v59').join(' '));
let state='idle', elapsed=0,last=0,step=0,nextTap=0,t=24,h=55,w=[false,false],heat=true, bugs=[],population=0,spawned=0,vanished=0,removed=0,splits=[0,0,0],warm=0,damp=0,paused=false,frameId=0;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rnd=(a,b)=>a+Math.random()*(b-a);
const foodWeights=[-0.5,1.0,3.0];
const tableParts=[...document.querySelectorAll('.tablePart')];
const blockedAreas=[[158,35,368,212],[635,35,845,212],[22,183,233,323],[391,167,467,261]];
function allowed(x,y){
  return blockedAreas.every(([left,top,right,bottom])=>
    x<left-23 || x>right+23 || y<top-23 || y>bottom+23);
}
function spawn(){
  let x,y;
  do {x=rnd(15,985);y=rnd(13,437)} while(!allowed(x,y));
  add(x,y);
}
function divide(parent,amount){
  let x=parent.x,y=parent.y;
  for(let attempt=0;attempt<20;attempt++){
    const angle=rnd(0,2*Math.PI),d=rnd(13,28);
    const nx=clamp(parent.x+d*Math.cos(angle),15,985);
    const ny=clamp(parent.y+d*Math.sin(angle),13,437);
    if(allowed(nx,ny)){x=nx;y=ny;break}
  }
  add(x,y,amount);
}
function zone(x,y){
  const onPlate=((x-595)/76)**2+((y-295)/21)**2<=1;
  const inPuddle=((x-158)/70)**2+((y-383)/20)**2<=1;
  if(onPlate||inPuddle)return 2;
  if(y<302)return 0;
  if(y<=423&&x>=263&&x<=900){
    const point=new DOMPoint(x,y);
    if(tableParts.some(part=>part.isPointInFill(point)))return 0;
  }
  return 1;
}
// Nearby bacteria in the same food zone share a drawing and independent event chances.
const groups=new Map();
const numbers=new Intl.NumberFormat('de-DE');
function updateLabel(bug){
  bug.label.textContent=bug.size>1?numbers.format(bug.size):'';
}
function add(x,y,amount=1){
  const z=zone(x,y);
  const key=[z,Math.floor(x/26),Math.floor(y/22)].join(',');
  population+=amount;
  const group=groups.get(key);
  if(group){group.size+=amount;updateLabel(group);return}
  const el=document.createElementNS(NS,'g'),r=rnd(-40,40);
  el.setAttribute('transform',`translate(${x} ${y})`);el.setAttribute('class','bug');
  el.innerHTML=`<circle r="22" fill="transparent"/><g transform="rotate(${r})"><use href="#bugArt" class="pulse"/></g><text y="21" text-anchor="middle" font-family="Arial" font-size="13" font-weight="bold" fill="#183f32" stroke="#fff" stroke-width="3" paint-order="stroke"></text>`;
  $('bugs').append(el);
  const bug={x,y,z,key,size:amount,pending:0,el,label:el.lastElementChild};
  groups.set(key,bug);bugs.push(bug);updateLabel(bug);
}
function signalEvent(bug){
  const loss=foodWeights[bug.z]<0;
  const marker=document.createElementNS(NS,'g');
  marker.setAttribute('transform',`translate(${bug.x} ${bug.y})`);
  const color=loss?'#a92347':'#775200';
  const light=loss?'#ffadc0':'#ffde43';
  marker.innerHTML=`<g class="signalHalo"><circle r="21" fill="none" stroke="${color}" stroke-width="9"/><circle r="21" fill="none" stroke="${light}" stroke-width="5"/></g><circle cx="15" cy="-14" r="10" fill="${color}" stroke="#fff" stroke-width="2"/><path d="M10-14h10${loss?'':'m-5-5v10'}" fill="none" stroke="white" stroke-width="3"/>`;
  $('signals').append(marker);bug.signal=marker;
}
function subtract(bug,amount){
  population-=amount;bug.size-=amount;
  if(bug.size){updateLabel(bug);return}
  bug.signal?.remove();bug.el.remove();groups.delete(bug.key);bugs.splice(bugs.indexOf(bug),1);
}
function clearSignals(){
  $('signals').replaceChildren();
  for(const bug of bugs)bug.signal=null;
}
function controls(){w.forEach((v,i)=>{const el=$('win'+i);el.classList.toggle('on',v);el.setAttribute('aria-pressed',v);const s='Fenster '+(i+1)+' · '+(v?'offen':'zu');$('winLabel'+i).textContent=s;el.setAttribute('aria-label',s)});$('heater').classList.toggle('on',heat);$('heatLabel').textContent='Heizung · '+(heat?'an':'aus');$('heater').setAttribute('aria-pressed',heat)}
function updateMeter(id,value,unit,level){
  const meter=$(id);
  meter.textContent=value+' '+unit;
  meter.dataset.level=level;
  meter.setAttribute('aria-label',meter.textContent+' – '+({green:'grüner Bereich',yellow:'Warnbereich',red:'kritischer Bereich'}[level]));
}
let lastMeterT,lastMeterH;
function updateMeters(){
  if(t===lastMeterT&&h===lastMeterH)return;
  lastMeterT=t;lastMeterH=h;
  const degrees=Math.round(t),percent=Math.round(h);
  updateMeter('temp',degrees,'°C',degrees<16||degrees>23?'red':degrees<18||degrees>21?'yellow':'green');
  updateMeter('humid',percent,'%',percent>55?'red':percent>45?'yellow':'green');
  const tempLevel=$('temp').dataset.level,humidityLevel=$('humid').dataset.level;
  const levels=[tempLevel,humidityLevel];
  const mood=levels.includes('red')?'traurig':levels.includes('yellow')?'neutral':'fröhlich';
  const feel=degrees<16?'cold':degrees>23?'hot':'comfortable';
  $('resident').dataset.feel=feel;
  $('resident').setAttribute('aria-label','Person auf dem Stuhl: '+mood+(feel==='cold'?', friert':feel==='hot'?', schwitzt':''));
  $('mouth').setAttribute('d',{'traurig':'M-8 6Q0-3 8 6','neutral':'M-7 4h14','fröhlich':'M-8 2Q0 13 8 2'}[mood]);
  $('mold').dataset.level=humidityLevel;
  const factor=climateFactor();
  const level=factor<=1?'green':factor<2?'yellow':'red';
  const status=$('divisionStatus');
  status.dataset.level=level;
  status.textContent={green:'langsam',yellow:'schneller',red:'sehr schnell'}[level];
}
function display(){$('clock').textContent=(60-step)+' s';$('timebar').style.width=(100*(60-step)/60)+'%';$('count').textContent=numbers.format(population);updateMeters();if(state==='running')$('ready').textContent=elapsed>=nextTap?'● Entfernen bereit':'Entfernen in '+Math.ceil(nextTap-elapsed)+' s'}
function updateRoomClimate(){
  const openWindows=Number(w[0])+Number(w[1]);
  if(openWindows){
    // Per open window, starting at 24 °C: 60 s to 12 °C with heat, 50 s without.
    const coolingPerSecond=openWindows*(heat?0.20:0.24);
    t=Math.max(12,t-coolingPerSecond);
    // Double the air exchange with both windows open. Warmer air also dries faster.
    const dryingRate=0.070*openWindows*(1+0.025*(t-21));
    h=30+(h-30)*Math.exp(-dryingRate);
  }else{
    t+=((heat?26:19)-t)*0.09;
    const targetHumidity=71-(t-19)*8/7;
    h+=(targetHumidity-h)*0.10;
  }
}
function climateFactor(){return ((t-12)/8)*((h-24)/21)}
function moldNote(){
  return Math.round(h)>45?'<p>Übrigens schimmelt deine Wohnung.</p>':'';
}
function lose(message){
  state='lost';clearSignals();$('help').disabled=false;$('start').disabled=false;
  $('start').textContent='Neue Runde';$('ready').textContent='Runde verloren';
  dialog('Runde verloren','<p>'+message+'</p>'+moldNote(),'Neue Runde');
}
const divisionTickSeconds=0.75;
function tick(wholeSecond,divisionTick){
  if(wholeSecond){
    updateRoomClimate();step++;
    if(t<14-1e-9){
      lose('Es ist sau kalt! Ja die Bakterien mögen das nicht, ich aber auch nicht!');
      return;
    }
    if(t>=23)warm++;if(h>=60)damp++;
  }
// Both factors are positive over the playable climate range and equal 1 at 20 °C / 45 %.
const climate=climateFactor();
const births=[];
for(const bug of [...bugs]){
  const weight=foodWeights[bug.z];
  if(weight<0 ? !wholeSecond : !divisionTick)continue;
  const due=bug.pending;
  const rate=weight>0 ? weight*climate : -weight/climate;
  // One warning tick, plus a geometric wait. At neutral climate and weight 1 the mean is six division ticks per division.
  const waitingFactor=weight>0?4:1;
  const chance=rate/(waitingFactor+rate);
  let warnings=0;
  for(let i=due;i<bug.size;i++)if(Math.random()<chance)warnings++;
  bug.pending=warnings;
  bug.signal?.remove();bug.signal=null;
  if(due){
    if(weight<0){subtract(bug,due);vanished+=due}
    else{splits[bug.z]+=due;births.push([bug,due])}
  }
  if(warnings)signalEvent(bug);
}
for(const [parent,amount] of births){
  // Distribute larger groups in several directions while keeping the exact offspring count.
  const portions=Math.min(amount,8);
  for(let i=0;i<portions;i++)divide(parent,Math.floor(amount/portions)+(i<amount%portions?1:0));
}
if(wholeSecond){
  const arrivals=Math.random()<0.75?1:2;
  for(let i=0;i<arrivals;i++)spawn();
  spawned+=arrivals;
}
if(population>10000)lose('Du Saubär! Über 10000 Bakterien in deiner Wohnung.');
}
let divisionTicks=0;
function advance(now){
  if(state!=='running'||paused)return;
  elapsed=Math.min(60,elapsed+Math.max(0,now-last)/1000);last=now;
  while(state==='running'){
    const nextDivision=(divisionTicks+1)*divisionTickSeconds;
    const nextSecond=step+1;
    const nextEvent=Math.min(nextDivision,nextSecond);
    if(nextEvent>elapsed)break;
    const divisionDue=nextDivision===nextEvent;
    if(divisionDue)divisionTicks++;
    tick(nextSecond===nextEvent,divisionDue);
  }
  display();if(state==='running'&&step===60)finish();
}
function frame(now){if(state!=='running'||paused)return;advance(now);if(state==='running')frameId=requestAnimationFrame(frame)}
function begin(){state='running';paused=false;elapsed=divisionTicks=step=nextTap=population=spawned=vanished=removed=warm=damp=0;t=24;h=55;heat=true;w=[false,false];splits=[0,0,0];bugs=[];groups.clear();clearSignals();$('bugs').replaceChildren();controls();display();$('start').textContent='Abbrechen';$('start').disabled=false;$('help').disabled=true;last=performance.now();frameId=requestAnimationFrame(frame)}
function dialog(title,html,button){$('title').textContent=title;$('message').innerHTML=html;$('close').textContent=button;$('dismiss').hidden=button!=='Neue Runde';$('modal').showModal()}
function finish(){state='done';clearSignals();$('help').disabled=false;$('start').disabled=false;$('start').textContent='Neue Runde';$('ready').textContent='Runde beendet';const total=splits.reduce((a,b)=>a+b,0);
const feedback=[
  [1,'(K)eine Bakterien! Insane! Du bist entweder ein*e Sauberkeitsgött*in oder hast eine Zwangsstörung!'],
  [10,'Weniger als 10 Bakterien. Crazy. Bei dir überlebt nichts was keinen Zellkern hat.'],
  [100,'Glückwunsch, du hast die Wohnung sauber gehalten wie ein Profi!'],
  [500,'Weiter so! Da ist aber noch Luft nach oben.']
].find(([limit])=>population<=limit);
dialog('Deine Runde',(feedback?'<p><strong>'+feedback[1]+'</strong></p>':'')+'<p><span class="score">'+numbers.format(population)+'</span> Bakterien übrig</p><p>'+spawned+' sind erschienen. Durch '+total+' Teilungen kamen '+total+' dazu. Von selbst verschwunden: '+vanished+'. Von dir entfernt: '+removed+'.</p><p><b>Raumklima</b><br>'+ (warm>=30?'Der Raum war oft warm. Schalte die Heizung früher aus, um Teilungen zu bremsen.':'Der Raum blieb meist kühler. Das hat die Teilung gebremst.')+' '+(damp>=30?'Die Luft war oft feucht. Öffne beide Fenster, damit sie im Spiel trockener wird.':'Die Luft war meist trockener. Auch das bremst die Teilung.')+'</p><p><b>Nahrung</b><br>'+splits[2]+' Teilungen auf dem Teller oder in der Saftpfütze. Dort gibt es die meiste Nahrung. Entferne diese Bakterien möglichst früh.</p>'+moldNote(),'Neue Runde')}
function abortRound(){
  cancelAnimationFrame(frameId);state='aborted';paused=false;clearSignals();
  $('ready').textContent='Runde abgebrochen';$('start').textContent='Neue Runde';$('help').disabled=false;
}
$('start').onclick=()=>state==='running'?abortRound():begin();
$('dismiss').onclick=()=>$('modal').close();
$('help').onclick=()=>dialog('So spielst du','<p>Halte die Zahl der grünen Bakterien 60 Sekunden lang möglichst klein. Die Runde endet vorzeitig, wenn die Temperatur unter 14 °C fällt oder die Bakterienzahl über 10000 steigt.</p><p><b>Antippen</b> entfernt ein Bakterium. Bei jedem Sekundenwechsel kannst du wieder ein Bakterium entfernen. Jede Sekunde erscheint mit 75 % Wahrscheinlichkeit ein neues Bakterium. Mit 25 % Wahrscheinlichkeit erscheinen zwei. Eine Zahl am Bakterium zeigt, wie viele dort sitzen. Ein Tipp entfernt genau eines.</p><p><b>Aus eins werden zwei.</b> Ein gelber Ring mit Plus kündigt eine Teilung an. Auf dem Boden teilen sich Bakterien langsam, auf dem Teller und in der Saftpfütze schneller. Bei Wärme und hoher Luftfeuchtigkeit teilen sich Bakterien schneller und verschwinden langsamer von selbst. Bei Kälte und trockener Luft ist es umgekehrt. Auf der Wand und der übrigen Tischfläche verschwinden Bakterien nach einer Weile. Vorher erscheint ein roter Ring mit Minus. Tippe auf Fenster und Heizung, um das Raumklima zu ändern.</p><p class="hint">Vereinfachtes Modell im Zeitraffer. Draußen hat es 12 °C. Zwei offene Fenster kühlen und trocknen den Raum schneller als eines. Die Heizung bremst das Abkühlen.</p>','Verstanden');$('close').onclick=()=>{const again=$('close').textContent==='Neue Runde';$('modal').close();if(again)begin()};
const objects=[$('win0'),$('win1'),$('heater')];objects.forEach((el,i)=>{function change(){if(state!=='running'||paused)return;advance(performance.now());if(state!=='running')return;if(i<2)w[i]=!w[i];else heat=!heat;controls()}el.onclick=change;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();change()}}});
$('scene').addEventListener('click',e=>{if(state!=='running'||paused||e.target.closest('.object'))return;advance(performance.now());if(state!=='running'||elapsed<nextTap)return;const svg=$('scene'),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());let best=-1,dist=23;bugs.forEach((b,i)=>{const d=Math.hypot(b.x-p.x,b.y-p.y);if(d<=dist){dist=d;best=i}});if(best>=0){const bug=bugs[best];if(bug.pending>0&&--bug.pending===0){bug.signal?.remove();bug.signal=null}subtract(bug,1);removed++;nextTap=step+1;display()}});
document.addEventListener('visibilitychange',()=>{if(state!=='running')return;if(document.hidden){advance(performance.now());paused=true;cancelAnimationFrame(frameId)}else if(paused){paused=false;last=performance.now();frameId=requestAnimationFrame(frame)}});controls();display();
</script></html>
